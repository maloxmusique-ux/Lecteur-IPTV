# Compile Canalix pour Android et Windows a chaque modification sur main.
# Les fichiers prets a installer sont publies dans la release "Derniere version"
# du depot (onglet Releases), facile a ouvrir depuis un telephone.
name: Compilation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"
  # Serveur de licences (variables GitHub "LICENSE_API" et "LICENSE_KEY").
  # Vides = mode test (paiements simules).
  LICENSE_DEFINES: --dart-define=LICENSE_API=${{ vars.LICENSE_API }} --dart-define=LICENSE_KEY=${{ vars.LICENSE_KEY }}

jobs:
  test:
    name: Analyse et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android (APK)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Cle de signature fixe : permet d'installer chaque nouvelle version
      # par-dessus l'ancienne sans perdre ses sources ni ses favoris.
      - name: Preparer la cle de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - run: flutter pub get
      - name: Compiler l'APK
        run: flutter build apk --release --build-number=${{ github.run_number }} ${{ env.LICENSE_DEFINES }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk Canalix-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Canalix-android
          path: Canalix-android.apk

      # Version Google Play (paiement Google Play), signee avec la cle fixe.
      - name: Compiler pour Google Play (AAB)
        if: hashFiles('android/key.properties') != ''
        run: |
          flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=STORE=google ${{ env.LICENSE_DEFINES }}
          mv build/app/outputs/bundle/release/app-release.aab Canalix-googleplay.aab
      - uses: actions/upload-artifact@v4
        if: hashFiles('Canalix-googleplay.aab') != ''
        with:
          name: Canalix-googleplay
          path: Canalix-googleplay.aab

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compiler pour Windows
        run: flutter build windows --release --build-number=${{ github.run_number }} ${{ env.LICENSE_DEFINES }}
      - name: Creer le zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Canalix-windows.zip
      # Installateur classique (Suivant, Suivant, Terminer) avec raccourcis.
      - name: Creer l'installateur
        shell: pwsh
        env:
          CANALIX_VERSION: 1.0.${{ github.run_number }}
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows\installer\canalix.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Canalix-windows
          path: |
            Canalix-windows.zip
            Canalix-setup.exe

  tv:
    name: Teles Samsung et LG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Paquets tele
        env:
          LICENSE_API: ${{ vars.LICENSE_API }}
          LICENSE_KEY: ${{ vars.LICENSE_KEY }}
        run: |
          ./tv/build.sh
          mv tv/dist/Canalix-lg.ipk tv/dist/Canalix-samsung.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Canalix-tv
          path: |
            Canalix-lg.ipk
            Canalix-samsung.zip

  apple:
    name: Mac et iPhone
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compiler pour Mac
        run: flutter build macos --release --build-number=${{ github.run_number }} ${{ env.LICENSE_DEFINES }}
      - name: Creer le zip Mac
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent Canalix.app "$GITHUB_WORKSPACE/Canalix-macos.zip"
      # Verification que l'app iPhone compile (sans signature : l'installation
      # se fait depuis Xcode sur le Mac avec le compte developpeur Apple).
      - name: Verifier la compilation iPhone
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }} ${{ env.LICENSE_DEFINES }}
      - uses: actions/upload-artifact@v4
        with:
          name: Canalix-macos
          path: Canalix-macos.zip

  publier:
    name: Publier la derniere version
    needs: [android, windows, apple, tv]
    # Windows et Android sont publies meme si la compilation Apple echoue.
    if: always() && needs.android.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Mettre a jour la release "Derniere version"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete derniere-version --yes --cleanup-tag || true
          gh release create derniere-version \
            $(ls Canalix-*) \
            --target "${{ github.sha }}" \
            --title "Dernière version (compilation n° ${{ github.run_number }})" \
            --notes "Compilée automatiquement depuis le commit ${{ github.sha }}.

          - **Android / Android TV** : télécharge \`Canalix-android.apk\` et ouvre-le pour l'installer.
          - **Windows** : télécharge \`Canalix-setup.exe\` et lance-le (installation avec raccourcis). Version sans installation : \`Canalix-windows.zip\`.
          - **Télé LG** : \`Canalix-lg.ipk\` (mode développeur LG). **Télé Samsung** : \`Canalix-samsung.zip\` à signer dans Tizen Studio (voir tv/README.md).
          - **Mac** : télécharge \`Canalix-macos.zip\`, décompresse-le, puis clic droit sur Canalix et Ouvrir." \
            --prerelease
