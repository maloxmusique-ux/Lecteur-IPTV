# Compile StreamFlow pour Android et Windows a chaque modification sur main.
# Les fichiers prets a installer sont publies dans la release "Derniere version"
# du depot (onglet Releases), facile a ouvrir depuis un telephone.
name: Compilation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  test:
    name: Analyse et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android (APK)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Cle de signature fixe : permet d'installer chaque nouvelle version
      # par-dessus l'ancienne sans perdre ses sources ni ses favoris.
      - name: Preparer la cle de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - run: flutter pub get
      - name: Compiler l'APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk StreamFlow-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StreamFlow-android
          path: StreamFlow-android.apk

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compiler pour Windows
        run: flutter build windows --release --build-number=${{ github.run_number }}
      - name: Creer le zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath StreamFlow-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StreamFlow-windows
          path: StreamFlow-windows.zip

  apple:
    name: Mac et iPhone
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compiler pour Mac
        run: flutter build macos --release --build-number=${{ github.run_number }}
      - name: Creer le zip Mac
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent streamflow.app "$GITHUB_WORKSPACE/StreamFlow-macos.zip"
      # Verification que l'app iPhone compile (sans signature : l'installation
      # se fait depuis Xcode sur le Mac avec le compte developpeur Apple).
      - name: Verifier la compilation iPhone
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: StreamFlow-macos
          path: StreamFlow-macos.zip

  publier:
    name: Publier la derniere version
    needs: [android, windows, apple]
    # Windows et Android sont publies meme si la compilation Apple echoue.
    if: always() && needs.android.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Mettre a jour la release "Derniere version"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete derniere-version --yes --cleanup-tag || true
          gh release create derniere-version \
            $(ls StreamFlow-*) \
            --target "${{ github.sha }}" \
            --title "Dernière version (compilation n° ${{ github.run_number }})" \
            --notes "Compilée automatiquement depuis le commit ${{ github.sha }}.

          - **Android / Android TV** : télécharge \`StreamFlow-android.apk\` et ouvre-le pour l'installer.
          - **Windows** : télécharge \`StreamFlow-windows.zip\`, décompresse-le, puis lance \`streamflow.exe\`.
          - **Mac** : télécharge \`StreamFlow-macos.zip\`, décompresse-le, puis clic droit sur StreamFlow et Ouvrir." \
            --prerelease
